name: Release

# Production APK release pipeline.
#
# Previously this workflow built an unsigned release APK (`assembleRelease` produced
# `app-release-unsigned.apk`) and published it to the release, and it set up no persistent
# signing identity. An unsigned APK cannot be upgraded in place (Android refuses an update
# whose signature differs from the installed one), and it can be silently replaced.
#
# This rewrite adds a real, fail-closed production signing configuration that matches the
# Daymark pipeline:
#   - `android/app/build.gradle` refuses the release task graph without credentials
#     (RELEASE_STORE_FILE / RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD).
#   - Here we fail closed early with a clear message, restore the keystore from a secret,
#     build the signed APK and AAB, verify the signature and package metadata, publish
#     SHA-256 checksums, and only then attach the artifacts to the release.
#
# NOTE: the release job cannot succeed until the four secrets exist (see docs/RELEASE-SIGNING.md).
# That is intentional — it is the difference between "unsigned artifact published" and "no
# production artifact unless it is properly signed".

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test src/lib

  apk:
    name: Build, sign and publish Android APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Capacitor 8 requires Java 21 (JDK 17 fails with an unsupported class-file-version
      # error during Gradle compilation).
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Fail closed without production signing credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Production signing credentials are missing:$missing"
            echo "Set the protected secrets described in docs/RELEASE-SIGNING.md." >&2
            exit 1
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build web assets
        run: bun run build
        env:
          # Set this repo secret so released APKs talk to your real Convex deployment.
          # WIthout it, the APK installs but has no backend.
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL || 'https://ci-placeholder.convex.cloud' }}

      - name: Sync web assets to Android
        run: bunx cap sync android

      - name: Restore the production keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p android/release
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/release/secure-vault-hub-release.jks
          test -s android/release/secure-vault-hub-release.jks

      - name: Build the signed release APK and AAB
        working-directory: android
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/android/release/secure-vault-hub-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify signature, metadata and prepare the payload
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          source_apk="android/app/build/outputs/apk/release/app-release.apk"
          source_aab="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$source_apk"
          test -s "$source_aab"
          unzip -t "$source_apk"

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n "$sdk_root" && -d "$sdk_root/build-tools" ]] || {
            echo "Android SDK build-tools not found (ANDROID_HOME/ANDROID_SDK_ROOT)" >&2
            exit 1
          }
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          [[ -x "$aapt" && -x "$apksigner" ]] || { echo "aapt or apksigner missing" >&2; exit 1; }

          "$apksigner" verify --verbose "$source_apk" 2>&1 | tee "$RUNNER_TEMP/svh-signature.txt"
          grep -q "Verified using v2 scheme: true\|Verified using v3 scheme: true" "$RUNNER_TEMP/svh-signature.txt" || {
            echo "APK Signature Scheme v2/v3 was not verified" >&2
            exit 1
          }

          badging="$RUNNER_TEMP/svh-badging.txt"
          "$aapt" dump badging "$source_apk" > "$badging"
          package_line="$(grep '^package: ' "$badging")"
          app_id="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$package_line")"
          version_name="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$package_line")"
          version_code="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "$package_line")"
          [[ "$app_id" == "app.securevaulthub.app" ]] || { echo "Unexpected application ID: $app_id" >&2; exit 1; }
          [[ -n "$version_name" && -n "$version_code" ]] || { echo "Version metadata missing" >&2; exit 1; }

          tag="${GITHUB_REF_NAME}"
          apk_name="SecureVaultHub-${tag}-release.apk"
          aab_name="SecureVaultHub-${tag}-release.aab"
          mkdir -p release-payload
          cp "$source_apk" "release-payload/$apk_name"
          cp "$source_aab" "release-payload/$aab_name"
          ( cd release-payload && sha256sum "$apk_name" "$aab_name" > SHA256SUMS.txt )
          ( cd release-payload && sha256sum -c SHA256SUMS.txt )

          {
            printf '### Signed release verification\n\n'
            printf -- '- Application ID: `%s`; version `%s` (code `%s`)\n' "$app_id" "$version_name" "$version_code"
            printf -- '- APK signature verification: PASS\n'
            printf -- '- SHA-256 checksums: `SHA256SUMS.txt` (verified)\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the decoded keystore
        if: always()
        run: rm -f android/release/secure-vault-hub-release.jks

      - name: Upload the verified payload
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: release-payload-${{ github.run_id }}
          path: release-payload/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      # The release write is gated on the tag ref so a workflow_dispatch run can build and
      # verify without mutating a release.
      - name: Publish the signed release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          files: |
            release-payload/*.apk
            release-payload/*.aab
            release-payload/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
