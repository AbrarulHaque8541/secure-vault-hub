name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned: a new bun major release must never break CI silently.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # Guard 1: secret files must never be tracked (the `.env.keys` incident).
      # .gitignore is not enough — force-added files still land in git.
      - name: Guard — no secret files tracked
        run: |
          LEAKED=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.keystore$|\.jks$|\.pem$' | grep -v '^\.env\.example$' || true)
          if [ -n "$LEAKED" ]; then
            echo "::error::Secret-looking files are tracked in git. Remove them and rotate any real credentials:"
            echo "$LEAKED"
            exit 1
          fi

      # Guard 2: Convex generated types must be committed. CI cannot run
      # `convex codegen` (it syncs with a deployment, which needs auth), so
      # after changing anything under src/convex/, run `bunx convex codegen`
      # locally and commit the regenerated files.
      - name: Guard — Convex generated types present
        run: |
          for f in api.d.ts api.js dataModel.d.ts server.d.ts; do
            test -f "src/convex/_generated/$f" || {
              echo "::error::src/convex/_generated/$f is missing. Run 'bunx convex codegen' locally and commit the generated files."
              exit 1
            }
          done

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun test src/lib

      # Guard 3: `bun install --frozen-lockfile` installs what bun.lock resolves,
      # not what package.json declares. A stale lockfile therefore keeps a
      # patched-looking package.json on the vulnerable version, so assert the
      # RESOLVED axios floor (H5: prototype pollution + DNS/proxy bypass).
      - name: Guard — lockfile dependency floors
        run: node scripts/check-lockfile-deps.mjs

      # Guard 4: the round-2 convex helpers (secret redaction, OTP rate limiting)
      # ship their own bun:test suites under src/convex/lib, which the
      # `bun test src/lib` step above does not discover.
      - name: Convex unit tests
        run: bun test src/convex/lib

  build-web:
    name: Production web build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          # Set this repo secret for a build that talks to your real backend;
          # CI falls back to a placeholder — enough to prove the build works.
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL || 'https://ci-placeholder.convex.cloud' }}

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 7
