name: Secrets Guard

# Defence in depth for the `.env.keys` incident.
#   job 1 (blocking)     — no secret-looking file may be tracked at HEAD
#   job 2 (non-blocking) — full-history scan, used to track the purge runbook
#
# Unlike `ci.yml`, this workflow deliberately runs on EVERY branch and on a
# schedule, so a leak is caught on the branch that introduces it rather than
# after it reaches main.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Weekly audit — catches secrets introduced by a force-push race.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tracked-secrets:
    name: No secret files tracked at HEAD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on tracked secret files
        run: |
          # `.env.example` is the only .env-ish file that may be tracked.
          # `.env.keys` holds the dotenvx PRIVATE key and must never be.
          LEAKED=$(git ls-files \
            | grep -E '(^|/)\.env($|\.)|\.[a-z]+\.keys$|\.keystore$|\.jks$|\.pem$|\.p12$|\.mobileprovision$' \
            | grep -v '^\.env\.example$' || true)
          if [ -n "$LEAKED" ]; then
            echo "::error::Secret-looking files are tracked in git. Untrack them AND rotate the credentials (see docs/SECRET-ROTATION.md):"
            echo "$LEAKED"
            exit 1
          fi
          echo "OK — no secret files tracked."

      - name: Fail on dotenvx private keys anywhere in the tree
        run: |
          # Catches a key committed under a different filename.
          if git grep -l -E 'DOTENV_PRIVATE_KEY_[A-Z_]+=' -- . ':!docs/**' ':!.env.example' >/dev/null 2>&1; then
            echo "::error::A dotenvx private key value is present in tracked files."
            git grep -n -E 'DOTENV_PRIVATE_KEY_[A-Z_]+=' -- . ':!docs/**' ':!.env.example' || true
            exit 1
          fi
          echo "OK — no dotenvx private key material found."

      - name: Fail on hardcoded provider API keys
        run: |
          # Provider-issued keys follow a `<prefix>_<random>` shape. They must
          # come from the environment, never from source.
          PATTERN='(x-api-key|apiKey|api_key)["'"'"']?[[:space:]]*[:=][[:space:]]*["'"'"'][a-z]{2,10}_[A-Za-z0-9]{16,}["'"'"']'
          if git grep -n -E "$PATTERN" -- '*.ts' '*.tsx' '*.js' '*.jsx' ':!**/*.test.ts' ':!src/convex/lib/**' >/dev/null 2>&1; then
            echo "::error::A provider API key looks hardcoded. Read it from process.env instead."
            git grep -n -E "$PATTERN" -- '*.ts' '*.tsx' '*.js' '*.jsx' ':!**/*.test.ts' ':!src/convex/lib/**' || true
            exit 1
          fi
          echo "OK — no hardcoded provider keys in source."

  history-audit:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    # NON-BLOCKING BY DESIGN: the leaked `.env.keys` still exists in commits
    # that predate the purge. Keep this visible without gating merges, then
    # remove `continue-on-error` as the final step of docs/SECRET-ROTATION.md.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — this job is meaningless on a shallow clone

      - name: Scan every commit for the leaked filenames
        run: |
          HITS=$(git log --all --oneline -- .env.keys | wc -l | tr -d ' ')
          echo "Commits touching .env.keys: $HITS"
          git log --all --oneline -- .env.keys || true
          if [ "$HITS" != "0" ]; then
            echo "::warning::.env.keys is still present in git history — run docs/SECRET-ROTATION.md step 2."
          fi

      - name: Scan every commit for dotenvx private key material
        run: |
          HITS=$(git log --all -S 'DOTENV_PRIVATE_KEY' --oneline | wc -l | tr -d ' ')
          echo "Commits containing DOTENV_PRIVATE_KEY: $HITS"
          if [ "$HITS" != "0" ]; then
            echo "::warning::Private key material is still reachable in history."
          fi

      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
