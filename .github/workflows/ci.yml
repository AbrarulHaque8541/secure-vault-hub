name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # Pinned: a new bun major release must never break CI silently.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      # Guard 1: secret files must never be tracked (the `.env.keys` incident).
      # .gitignore is not enough — force-added files still land in git.
      - name: Guard — no secret files tracked
        run: |
          LEAKED=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.[Kk]eystore$|\.jks$|\.pem$' | grep -v '^\.env\.example$' || true)
          if [ -n "$LEAKED" ]; then
            echo "::error::Secret-looking files are tracked in git. Remove them and rotate any real credentials:"
            echo "$LEAKED"
            exit 1
          fi

      # Guard 2: generated APKs are published from CI now, so a committed APK is always a
      # stale binary in a public repo. Fail rather than let one drift back in.
      - name: Guard — no committed APKs
        run: |
          LEAKED=$(git ls-files | grep -E '\.(apk|aab)$' || true)
          if [ -n "$LEAKED" ]; then
            echo "::error::Built Android binaries are tracked in git. Publish them from the release workflow instead:"
            echo "$LEAKED"
            exit 1
          fi

      # Guard 3: Convex generated types must be committed. CI cannot run
      # `convex codegen` (it syncs with a deployment, which needs auth), so
      # after changing anything under src/convex/, run `bunx convex codegen`
      # locally and commit the regenerated files.
      - name: Guard — Convex generated types present
        run: |
          for f in api.d.ts api.js dataModel.d.ts server.d.ts; do
            test -f "src/convex/_generated/$f" || {
              echo "::error::src/convex/_generated/$f is missing. Run 'bunx convex codegen' locally and commit the generated files."
              exit 1
            }
          done

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun test src/lib

  build-web:
    name: Production web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          # Set this repo secret for a build that talks to your real backend;
          # CI falls back to a placeholder — enough to prove the build works.
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL || 'https://ci-placeholder.convex.cloud' }}

      - name: Upload web dist
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: web-dist
          path: dist
          retention-days: 7
